sonar.projectKey=3D-Online-Schach
sonar.projectName=3D-Online-Schach
sonar.sourceEncoding=UTF-8

sonar.sources=apps/client/src,apps/server/src,apps/server/prisma,packages/chess-core/src,packages/shared/src
sonar.tests=apps/client/src,apps/server/src,packages/chess-core/src,packages/shared/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.scannerwork/**,**/.git/**,**/*.config.*
sonar.coverage.exclusions=**/*.d.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,apps/server/prisma/migrations/**,apps/client/src/main.tsx,apps/client/src/board/ChessScene.tsx

sonar.javascript.lcov.reportPaths=apps/client/coverage/lcov.info,apps/server/coverage/lcov.info,packages/chess-core/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/client/coverage/lcov.info,apps/server/coverage/lcov.info,packages/chess-core/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.qualitygate.wait=true

# Sonar's TypeScript JSX analyzer does not load React Three Fiber's custom
# intrinsic-element declarations. These are valid R3F properties, not unknown
# React DOM attributes, so suppress only S6747 for the two R3F render surfaces.
sonar.issue.ignore.multicriteria=r3f-board,r3f-canvas,r3f-knight
sonar.issue.ignore.multicriteria.r3f-board.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.r3f-board.resourceKey=apps/client/src/board/ChessScene.tsx
sonar.issue.ignore.multicriteria.r3f-canvas.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.r3f-canvas.resourceKey=apps/client/src/App.tsx
sonar.issue.ignore.multicriteria.r3f-knight.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.r3f-knight.resourceKey=apps/client/src/board/KnightSculpt.tsx
