services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: chess3d
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5433:5432'
    volumes:
      - chess3d-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chess3d']
      interval: 5s
      timeout: 5s
      retries: 12

  dependencies:
    build:
      context: .
    working_dir: /workspace
    volumes: &workspace-volumes
      - .:/workspace
      - chess3d-node-modules:/workspace/node_modules
      - chess3d-client-node-modules:/workspace/apps/client/node_modules
      - chess3d-server-node-modules:/workspace/apps/server/node_modules
      - chess3d-chess-core-node-modules:/workspace/packages/chess-core/node_modules
      - chess3d-shared-node-modules:/workspace/packages/shared/node_modules
    command: pnpm install --frozen-lockfile

  server:
    build:
      context: .
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/chess3d?schema=public
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - '3001:3001'
    volumes: *workspace-volumes
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: >
      sh -c "pnpm --filter @chess3d/server db:generate &&
      pnpm --filter @chess3d/server exec prisma migrate deploy --schema prisma/schema.prisma &&
      pnpm --filter @chess3d/server dev"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  client:
    build:
      context: .
    working_dir: /workspace
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes: *workspace-volumes
    depends_on:
      dependencies:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    command: pnpm --filter @chess3d/client dev --host 0.0.0.0

volumes:
  chess3d-postgres:
  chess3d-node-modules:
  chess3d-client-node-modules:
  chess3d-server-node-modules:
  chess3d-chess-core-node-modules:
  chess3d-shared-node-modules:
